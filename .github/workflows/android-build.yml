name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md"]
  pull_request:

env:
  GODOT_VERSION: "4.3"
  BUILD_TOOLS: "34.0.0"
  PLATFORM: "android-34"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot-dl" && cd "$HOME/godot-dl"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;${PLATFORM}" "cmdline-tools;latest"

      - name: Create debug keystore and configure Godot
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOT
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Import project resources and validate scripts
        run: |
          set -uo pipefail
          mkdir -p build
          godot --headless --path . --import 2>&1 | tee build/import.log || true
          godot --headless --path . --import 2>&1 | tee -a build/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" build/import.log; then
            echo "::error::GDScript errors found - see log above"
            exit 1
          fi
          echo "Scripts compiled cleanly."

      - name: Run automated tests (headless)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . res://tests/test_runner.tscn 2>&1 | grep -v -e "mesh_get_surface_count" -e 'Parameter "m" is null' | tee build/test-report.txt

      - name: Export debug APK (ARM64 + ARMv7)
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android Debug" build/LastDistrict-debug.apk 2>&1 | tee build/export-debug.log
          test -s build/LastDistrict-debug.apk

      - name: Export signed release APK (only if secrets are configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_KEYSTORE_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          godot --headless --path . --export-release "Android Release" build/LastDistrict-release.apk
          test -s build/LastDistrict-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/LastDistrict-debug.apk
          SIZE=$(stat -c %s "$APK")
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 5000000 ] || { echo "::error::APK suspiciously small"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libgodot_android.so"
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|native-code|launchable" | tee build/apk-info.txt
          "$BT/apksigner" verify --verbose "$APK" | tee build/apksigner.txt

      - name: Build report
        if: always()
        run: |
          {
            echo "## Last District - Android build report"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Godot | ${GODOT_VERSION}-stable |"
            echo "| Tests step | ${{ steps.tests.outcome }} |"
            if [ -f build/LastDistrict-debug.apk ]; then
              echo "| Debug APK | built, $(stat -c %s build/LastDistrict-debug.apk) bytes |"
            else
              echo "| Debug APK | NOT built |"
            fi
            if [ -f build/LastDistrict-release.apk ]; then echo "| Release APK | built (signed) |"; else echo "| Release APK | skipped (no signing secrets) |"; fi
            echo ""
            echo "### Test report"
            echo '```'
            grep -E "^(FAIL|RESULT)" build/test-report.txt 2>/dev/null || echo "no test report"
            echo '```'
            echo "### APK info"
            echo '```'
            cat build/apk-info.txt 2>/dev/null || echo "no APK info"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LastDistrict-android-apk
          path: |
            build/*.apk
            build/*.txt
            build/*.log
          if-no-files-found: warn
